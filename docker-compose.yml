version: '3.8'

services:
  balabol:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: balabol-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./server/data:/app/server/data
    environment:
      - PORT=3001
      - NODE_ENV=production
      - JWT_SECRET=balabol-super-secret-key-change-in-production

  # Опциональный автоматический HTTPS через Caddy (получает SSL-сертификат сам)
