[package]
name = "balabol-rendezvous"
version = "0.1.0"
edition = "2021"
description = "High-performance stateless Rendezvous tracker for Balabol P2P network"

[dependencies]
axum = "0.8"
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = { version = "2.1", features = ["serde"] }
dashmap = "6.1"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
thiserror = "2.0"
