[package]
name = "balabol-desktop"
version = "0.1.0"
description = "Balabol Desktop - Ultra-low latency P2P Discord alternative"
authors = ["Balabol Team"]
edition = "2021"

[lib]
name = "balabol_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
balabol-engine = { path = "../../core/crates/engine" }
balabol-audio = { path = "../../core/crates/audio" }
balabol-capture = { path = "../../core/crates/capture" }
balabol-storage = { path = "../../core/crates/storage" }
balabol-net = { path = "../../core/crates/net" }
