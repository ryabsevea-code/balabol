[package]
name = "balabol-desktop"
version = "0.1.0"
description = "Balabol Desktop - P2P Voice and Handshake"
authors = ["Balabol Team"]
edition = "2021"

[lib]
name = "balabol_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
bincode = "1.3"
rand = "0.8"
base64 = "0.22"
parking_lot = "0.12"
windows-sys = { version = "0.59", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_Ndis",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
sha2 = "0.11.0"
secp256k1 = { version = "0.33.1", features = ["rand"] }
hex = "0.4.3"
futures-util = "0.3.34"
cpal = "0.15"
jpeg-encoder = "0.7.1"
chacha20poly1305 = "0.10"
argon2 = "0.5"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
